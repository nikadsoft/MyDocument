name: Release installers (Windows/macOS)

# Linux CI and Linux packaging now run on Jenkins - see Jenkinsfile.
# This workflow only builds the platforms Jenkins can't (no Windows/macOS
# agents), and only on an actual release tag, not every push.

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: msi
          - os: macos-latest
            ext: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Build ICNS icon (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p src/main/packaging/macos/icon.iconset
          SRC=src/main/resources/net/nikad/mydocument/icon.png
          for s in 16 32 64 128 256 512; do
            sips -z $s $s "$SRC" --out "src/main/packaging/macos/icon.iconset/icon_${s}x${s}.png"
            sips -z $((s*2)) $((s*2)) "$SRC" --out "src/main/packaging/macos/icon.iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns src/main/packaging/macos/icon.iconset \
            -o src/main/packaging/macos/icon.icns

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build installer
        run: ./gradlew jpackage

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.ext }}
          path: build/jpackage/*.${{ matrix.ext }}
          retention-days: 30

  release:
    name: Create Release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          generate_release_notes: true
