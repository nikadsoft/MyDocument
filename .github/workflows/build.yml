name: Build & Test

on:
  push:
    branches: [ "main", "develop" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write      # needed to create releases
  checks: write
  pull-requests: write

# ── Job 1: compile + test + coverage ─────────────────────────────────────────
jobs:
  build:
    name: Build and Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ '21' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: gradle

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assemble

      - name: Test (headless)
        run: xvfb-run --auto-servernum ./gradlew test jacocoTestReport jacocoTestCoverageVerification
        env:
          DISPLAY: ':99'

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/test/*.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
          retention-days: 14

      - name: Coverage summary (PR comment)
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Code Coverage
          min-coverage-overall: 80
          min-coverage-changed-files: 80

# ── Job 2: build platform installers ─────────────────────────────────────────
  package:
    name: Package (${{ matrix.os }})
    needs: build
    # Only run on pushes (not PRs) — tags trigger the release job too
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: deb
          - os: windows-latest
            ext: msi
          - os: macos-latest
            ext: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Install fakeroot (Linux .deb)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y fakeroot

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build installer
        run: ./gradlew jpackage

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.ext }}
          path: build/jpackage/*.${{ matrix.ext }}
          retention-days: 30

# ── Job 3: GitHub release (tags only) ────────────────────────────────────────
  release:
    name: Create Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          generate_release_notes: true
