import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'jacoco'
    id 'org.beryx.jlink' version '4.0.0'
}

group = 'net.nikad'
version = '1.0.2'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web']
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.4.0'

    implementation 'org.commonmark:commonmark:0.28.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.28.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.28.0'
    implementation 'org.commonmark:commonmark-ext-autolink:0.28.0'
    implementation 'org.commonmark:commonmark-ext-heading-anchor:0.28.0'

    testImplementation platform('org.junit:junit-bom:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.testfx:testfx-junit5:4.0.18'
    testImplementation 'org.testfx:testfx-core:4.0.18'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.openjfx:javafx-graphics:27-ea+17:linux'
}

application {
    mainClass = 'net.nikad.mydocument.MyDocumentApp'
}

processResources {
    filesMatching('**/version.properties') {
        expand(projectVersion: project.version.toString())
    }
}

test {
    useJUnitPlatform()
    jvmArgs '-Dtestfx.robot=glass', '-Dtestfx.headless=true',
            '-Dprism.order=sw', '-Dprism.verbose=true',
            '-Djava.awt.headless=true'
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.14'
}

// JavaFX application entry point and FXML controller are pure UI wiring;
// exclude them so the 80% threshold applies only to testable business logic.
def jacocoExcludes = [
    'net/nikad/mydocument/MyDocumentApp.class',
    'net/nikad/mydocument/controller/**',
]

jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

// ── jlink / jpackage ──────────────────────────────────────────────────────────
jlink {
    options = ['--strip-debug', '--compress=zip-6', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'mydocument'
    }
    jpackage {
        installerName = 'MyDocument'
        appVersion    = project.version.replaceAll('-SNAPSHOT', '')
        vendor        = 'Nikad'
        imageName     = 'MyDocument'
        def baseOpts = [
            '--description', 'Markdown editor with WYSIWYG, source and preview modes',
            '--file-associations', project.file('src/main/packaging/file-associations.properties').absolutePath
        ]
        if (OperatingSystem.current().windows) {
            installerType   = 'msi'
            icon            = 'src/main/packaging/windows/icon.ico'
            installerOptions = baseOpts + ['--win-menu', '--win-shortcut', '--win-dir-chooser']
        } else if (OperatingSystem.current().macOsX) {
            installerType   = 'dmg'
            icon            = 'src/main/packaging/macos/icon.icns'
            installerOptions = baseOpts
        } else {
            installerType   = 'deb'
            icon            = 'src/main/packaging/linux/icon.png'
            installerOptions = baseOpts + ['--linux-shortcut']
        }
    }
}
